name: Run Linters and Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  linters:
    runs-on: ubuntu-latest
    permissions:
        security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v3
        with:
          python-version: 3.13
      - name: Install dependencies
        # pyproject.toml points pyright at .venv, so the pre-commit hook sees the dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.dev.txt
      - name: Run linters, formatter, typechecker and Bandit
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
      - name: Run Tests
        run: .venv/bin/pytest -vv
