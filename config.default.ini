# Default configuration. Copy this file to config.ini and edit it to your needs.

[SENSOR]
# Alignment of the compass vs the zero point for the wind direction
# Point the compass straight into the wind and read the compass heading and wind angle
# Subtract the read wind angle from the heading to receive the COMPASS_OFFSET
# Positive values indicate that the north of the measurement unit is offset clockwise from the compass north.
COMPASS_OFFSET_DEGREES = 0

[LOGGING]
# Name of the log file. If empty, will only log to the console
LOG_FILE = master.log
# Which information should be logged, default is WARNING
# Possible values: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL = WARNING
# Maximum size of the log file in kilobytes. If the file exceeds this size, it will be rotated
# Default is 5000 KB (5 MB)
MAX_LOG_SIZE = 5000
# Maximum number of log files to keep. If the number of log files exceeds this value, the oldest file will be deleted
# Default is 10
MAX_LOG_FILES = 10

# Name of the directory for data log files. If empty, will not log data streams
DATA_LOG_DIR = data_logs
# Maximum size of each data log file in kilobytes. If the file exceeds this size, it will be rotated
# Default is 100'000 KB (100 MB)
MAX_DATA_LOG_SIZE = 100000

[NETWORK]
# Order in which order the network interfaces should be used if available.
# If empty, the default interface will be used.
INTERFACE_PRIORITY = wlan0, usb0

# Start a local webserver to display the data and manage the Wi-Fi.
# If enabled and not connected to a network, an access point will be created
# (see ENABLE_HOTSPOT). It is reachable at e.g. http://10.42.0.1 on the access point.
ENABLE_LOCAL_WEBSERVER = true
# Port of the local webserver. Default is 80
WEBSERVER_PORT = 80
# Password required to change the Wi-Fi settings on the dashboard. setup.sh generates
# one per windbot. If empty, anyone who can reach the dashboard can change them.
#ADMIN_PASSWORD =

# Open an access point serving the dashboard when the Wi-Fi isn't connected to a
# known network. Needs NetworkManager (see scripts/setup-hotspot.sh) and
# ENABLE_LOCAL_WEBSERVER. Default is true
ENABLE_HOTSPOT = true
# Wi-Fi interface used for networks and the access point. The local webserver only
# accepts connections on it and on localhost, so it isn't reachable over 4G.
# Default is wlan0
WIFI_INTERFACE = wlan0

# SSID and password for the access point. The password needs 8 to 63 characters, if
# it is empty the access point is open. setup.sh sets both per windbot (the SSID ends
# with the last 4 characters of the Pi's serial number); the defaults below are the
# same on every windbot and the password is public, so change them on a windbot set
# up by hand.
AP_SSID = WindSensor
AP_PASSWORD = WindSensor
# Seconds after startup to wait for a known network before opening the access point.
# Default is 60
AP_STARTUP_DELAY_SECONDS = 60
# Seconds without a network connection, e.g. after the network dropped, before the
# access point is opened again. Default is 180
AP_FALLBACK_DELAY_SECONDS = 180


[MQTT]
# Address of the MQTT broker, if empty or commented out, MQTT will be disabled
BROKER = broker.hivemq.com
PORT = 8883

# Credentials for the MQTT broker. Uncomment if needed
#USERNAME =
#PASSWORD =

CLIENT_ID = bot1
TOPIC = bot1

# How many datapoints should be grouped together before sending them to the MQTT broker
# This allows for data savings at the cost of increased latency. To effectively disable, set to 1
# Maximum is 30
QUEUE_SIZE = 5
