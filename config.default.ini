# Default configuration. Copy this file to config.ini and edit it to your needs.

[SENSOR]
# Alignment of the compass vs the zero point for the wind direction
# Point the compass straight into the wind and read the compass heading and wind angle
# Subtract the read wind angle from the heading to receive the COMPASS_OFFSET
# Positive values indicate that the north of the measurement unit is offset clockwise from the compass north.
COMPASS_OFFSET_DEGREES = 0

[COMPASS]
# Where the heading comes from: magnetometer (local MEMS magnetometer and IMU on I2C)
# or nmea2000 (Vessel Heading PGN 127250 from a compass on the network).
# Default is nmea2000 if this is missing.
SOURCE = magnetometer
# Magnetometer chips: mmc5983ma and/or rm3100, comma separated. With two, each is
# calibrated on its own, their headings are averaged, and if they disagree the one that
# agrees with the gyro is used. IMU chip: ism330dhcx.
MAGNETOMETER = rm3100, mmc5983ma
IMU = ism330dhcx
# I2C bus number (/dev/i2c-1) and addresses, comma separated in the order of
# MAGNETOMETER. Leave them commented out (or write "default") to use the chips'
# defaults (MMC5983MA 0x30, RM3100 0x20, ISM330DHCX 0x6A).
I2C_BUS = 1
#MAGNETOMETER_ADDRESS = 0x20, 0x30
#IMU_ADDRESS = 0x6A
# Which sensor axes point forward, to starboard and down, in that order.
# "x,-y,-z" is right for a breakout lying flat, components up, with its x arrow to the bow.
# Separate the entries for several magnetometers with ";", one entry applies to all.
MAGNETOMETER_AXES = x,-y,-z
IMU_AXES = x,-y,-z
# Sensor sample rate and the rate the heading is passed on at, in Hz
SAMPLE_RATE_HZ = 50
OUTPUT_RATE_HZ = 10
# Bench calibration of the finished unit, written by src/calibrate_compass.py.
# {sensor} is replaced by the magnetometer's name.
BENCH_CALIBRATION_FILE = compass_bench_{sensor}.json
# The continuous calibration is stored here and restored on startup
CALIBRATION_FILE = compass_calibration.json
# Learn the boat's iron from normal turns while underway
CONTINUOUS_CALIBRATION = true
# Learn the offset between the compass and the course over ground on straight runs
# above 3 m/s. It includes the declination and the sensor's mounting angle.
GNSS_ALIGNMENT = true
# Magnetic declination in degrees, positive east (about 3-4 in northern Germany).
# Not needed with GNSS_ALIGNMENT, which learns it.
DECLINATION_DEGREES = 0
# Send the heading to the NMEA2000 network as Vessel Heading (PGN 127250)
SEND_HEADING = true

[LOGGING]
# Name of the log file. If empty, will only log to the console
LOG_FILE = master.log
# Which information should be logged, default is WARNING
# Possible values: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL = WARNING
# Maximum size of the log file in kilobytes. If the file exceeds this size, it will be rotated
# Default is 5000 KB (5 MB)
MAX_LOG_SIZE = 5000
# Maximum number of log files to keep. If the number of log files exceeds this value, the oldest file will be deleted
# Default is 10
MAX_LOG_FILES = 10

# Name of the directory for data log files. If empty, will not log data streams
DATA_LOG_DIR = data_logs
# Maximum size of each data log file in kilobytes. If the file exceeds this size, it will be rotated
# Default is 100'000 KB (100 MB)
MAX_DATA_LOG_SIZE = 100000

[NETWORK]
# Order in which order the network interfaces should be used if available.
# If empty, the default interface will be used.
INTERFACE_PRIORITY = wlan0, usb0

# Start a local webserver to display the data
# If enabled and not connected to a network, an access point will be created
ENABLE_LOCAL_WEBSERVER = false

# SSID and password for the access point
AP_SSID = WindSensor
AP_PASSWORD = WindSensor


[MQTT]
# Address of the MQTT broker, if commented out, MQTT will be disabled
BROKER = broker.hivemq.com
PORT = 8883

# Credentials for the MQTT broker. Uncomment if needed
#USERNAME =
#PASSWORD =

CLIENT_ID = bot1
TOPIC = bot1

# How many datapoints should be grouped together before sending them to the MQTT broker
# This allows for data savings at the cost of increased latency. To effectively disable, set to 1
# Maximum is 30
QUEUE_SIZE = 5


[GPS]
# Serial device of the GPS receiver
SERIAL_PORT = /dev/ttyACM0
# Receiver ports to enable the UBX messages on: I2C, UART1, UART2, USB, SPI
PORTS = USB
# Dynamic platform model the receiver uses to smooth its solution.
# Possible values: portable, stationary, pedestrian, automotive, sea, airborne1g,
# airborne2g, airborne4g, wrist. Default is sea.
# Note: the NEO-M8U's dead reckoning (UDR) only runs with the automotive model.
DYNAMIC_MODEL = sea
# GNSS navigation rate in Hz. The NEO-M8U supports up to 2 Hz. Default is 2
NAVIGATION_RATE_HZ = 2

[FILTER]
# Use a Kalman filter to estimate the boat's velocity at the time of each wind
# measurement. If disabled, the GPS samples between two wind measurements are averaged.
ENABLED = true
# Typical acceleration of the boat in m/s². Larger values react faster to manoeuvres,
# smaller values smooth more. Default is 0.3
ACCELERATION_SIGMA = 0.3
# Time in seconds over which an acceleration is expected to persist. Default is 2
ACCELERATION_TIME_CONSTANT = 2
